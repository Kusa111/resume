<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111317" />
    <title>ЕГЭ Слова — тренажёр</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <section id="mode-screen" class="screen mode-screen">
        <div class="hero">
          <span class="eyebrow">Русский язык · ЕГЭ</span>
          <h1>ЕГЭ Слова</h1>
          <p>Выберите раздел и тип тренировки</p>
        </div>

        <div class="mode-list" aria-label="Выбор режима">
          <section class="mode-group">
            <div class="group-title">Задание 9</div>
            <div class="group-actions">
              <button class="mode-card" data-mode="task9_learn" type="button">Исключения</button>
              <button class="mode-card" data-mode="task9_hard" type="button">Хард слова</button>
            </div>
          </section>

          <section class="mode-group">
            <div class="group-title">Задание 10</div>
            <div class="group-actions">
              <button class="mode-card" data-mode="task10_learn" type="button">Исключения</button>
              <button class="mode-card" data-mode="task10_hard" type="button">Хард слова</button>
            </div>
          </section>

          <section class="mode-group">
            <div class="group-title">Задание 11</div>
            <div class="group-actions">
              <button class="mode-card" data-mode="task11_learn" type="button">Исключения</button>
              <button class="mode-card" data-mode="task11_hard" type="button">Хард слова</button>
            </div>
          </section>

          <section class="mode-group">
            <div class="group-title">Задание 12</div>
            <div class="group-actions">
              <button class="mode-card" data-mode="task12_learn" type="button">Исключения</button>
              <button class="mode-card" data-mode="task12_hard" type="button">Хард слова</button>
            </div>
          </section>

          <section class="mode-group prepri-group">
            <div class="group-title">ПРЕ / ПРИ</div>
            <button class="mode-card wide" data-mode="prepri" type="button">Е / И по смыслу</button>
          </section>
        </div>
      </section>

      <section id="trainer-screen" class="screen trainer-screen hidden" aria-live="polite">
        <div id="success-banner" class="success-banner hidden" role="status"></div>

        <header class="topbar">
          <button id="back-top" class="ghost-button" type="button">Разделы</button>
          <div class="metrics">
            <div class="streak-pill">WIN STREAK <strong id="streak">0</strong></div>
            <div class="timer-pill" id="timer">00:00</div>
          </div>
        </header>

        <main class="trainer-main">
          <p id="current-mode" class="mode-title">Задание</p>
          <div id="masked-word" class="masked-word">сл_во</div>
          <p id="result-message" class="result-message hidden"></p>
          <div id="choice-row" class="choice-row" aria-label="Варианты ответа"></div>
        </main>
      </section>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
