<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111317" />
    <title>ЕГЭ Слова — тренажёр</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <section id="mode-screen" class="screen mode-screen">
        <div class="hero">
          <span class="eyebrow">Русский язык · ЕГЭ</span>
          <h1>ЕГЭ Слова</h1>
          <p>Выберите раздел для тренировки</p>
        </div>

        <div class="mode-list" aria-label="Выбор режима">
          <button class="mode-card" data-mode="task9" type="button">
            <span>Задание 9</span>
            <small>Корни и исключения</small>
          </button>
          <button class="mode-card" data-mode="task10" type="button">
            <span>Задание 10</span>
            <small>Приставки</small>
          </button>
          <button class="mode-card" data-mode="task11" type="button">
            <span>Задание 11</span>
            <small>Суффиксы</small>
          </button>
          <button class="mode-card" data-mode="task12" type="button">
            <span>Задание 12</span>
            <small>Глаголы и причастия</small>
          </button>
          <button class="mode-card" data-mode="prepri" type="button">
            <span>ПРЕ / ПРИ</span>
            <small>Приставки по смыслу</small>
          </button>
        </div>
      </section>

      <section id="trainer-screen" class="screen trainer-screen hidden" aria-live="polite">
        <div id="success-banner" class="success-banner hidden" role="status"></div>

        <header class="topbar">
          <button id="back-top" class="ghost-button" type="button">Разделы</button>
          <div class="streak-pill">WIN STREAK <strong id="streak">0</strong></div>
        </header>

        <main class="trainer-main">
          <p id="current-mode" class="mode-title">Задание</p>
          <div id="masked-word" class="masked-word">сл_во</div>
          <div id="choice-row" class="choice-row" aria-label="Варианты ответа"></div>
          <p id="result-message" class="result-message hidden"></p>
        </main>

        <footer class="bottom-actions">
          <button id="skip-button" class="secondary-button" type="button">Пропустить</button>
          <button id="change-mode" class="secondary-button" type="button">Сменить раздел</button>
        </footer>
      </section>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
