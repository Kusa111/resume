<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f3ec" />
    <title>ЕГЭ Слова — тренажёр сложных орфограмм</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <section id="mode-screen" class="screen mode-screen">
        <div class="hero">
          <span class="eyebrow">Русский язык · ЕГЭ</span>
          <h1>ЕГЭ Слова</h1>
          <p>Тренажёр сложных орфограмм</p>
        </div>

        <div class="mode-list" aria-label="Выбор режима">
          <button class="mode-card" data-mode="task9">
            <span>Задание 9</span>
            <small>Корни, исключения, Ы/И, О/Ё</small>
          </button>
          <button class="mode-card" data-mode="task10">
            <span>Задание 10</span>
            <small>Приставки, Ъ/Ь, Ы/И после приставок</small>
          </button>
          <button class="mode-card" data-mode="task11">
            <span>Задание 11</span>
            <small>Суффиксы разных частей речи</small>
          </button>
          <button class="mode-card" data-mode="task12">
            <span>Задание 12</span>
            <small>Причастия и глагольные формы</small>
          </button>
          <button class="mode-card accent" data-mode="prepri">
            <span>ПРЕ/ПРИ</span>
            <small>Значения приставок и омонимичные пары</small>
          </button>
        </div>
      </section>

      <section id="trainer-screen" class="screen trainer-screen hidden" aria-live="polite">
        <header class="topbar">
          <button id="back-top" class="ghost-button" type="button">← Разделы</button>
          <div class="streak-pill">WIN STREAK: <strong id="streak">0</strong></div>
        </header>

        <main class="trainer-main">
          <div class="session-line">
            <span id="current-mode">Задание</span>
            <span><b id="solved-count">0</b> решено · best <b id="best-streak">0</b></span>
          </div>

          <article id="word-card" class="word-card">
            <div class="card-glow"></div>
            <p class="card-label">Вставьте пропущенную букву/часть</p>
            <h2 id="masked-word">сл_во</h2>
            <p id="context" class="context hidden"></p>
            <p id="result-message" class="result-message hidden"></p>
          </article>

          <form id="answer-form" class="answer-form" autocomplete="off">
            <label class="input-label" for="answer-input">Ваш ответ</label>
            <div class="input-row">
              <input id="answer-input" inputmode="text" maxlength="3" placeholder="е / и / ъ" aria-label="Введите ответ" />
              <button id="check-button" class="primary-button" type="submit">Проверить</button>
            </div>
          </form>

          <div id="choice-row" class="choice-row" aria-label="Варианты ответа"></div>
        </main>

        <footer class="bottom-actions">
          <button id="skip-button" class="secondary-button" type="button">Пропустить</button>
          <button id="next-button" class="secondary-button hidden" type="button">Дальше</button>
          <button id="change-mode" class="secondary-button" type="button">Сменить раздел</button>
        </footer>
      </section>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
